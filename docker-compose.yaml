services:
  #nginx
  web:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf

  #php
  app:
    build:
      dockerfile: ./php/Dockerfile
    volumes:
      - ./app:/app

  #mysql
  db:
     image: mysql:8.0
     volumes:
        - mysqldata:/var/lib/mysql
     ports:
        - "3306:3306"
     restart: unless-stopped
     environment:
       MYSQL_ROOT_PASSWORD: root
       MYSQL_USER: user
       MYSQL_PASSWORD: secret
       MYSQL_DATABASE: docker-php

  #phpmyadmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: user
      PMA_PASSWORD: secret
    depends_on:
      - db
        
  #redis

volumes:
  mysqldata: